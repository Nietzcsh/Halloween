[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Firebase web config is public by design (security is enforced by Firebase
  # Security Rules), and Vite inlines VITE_* vars into the client bundle.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_MESSAGING_SENDER_ID"

# Single-page app: send every route (/budget, /polls/abc, /admin) to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
